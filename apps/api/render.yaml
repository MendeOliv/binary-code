# Render Web Service — Código Binário API
# Docs: https://render.com/docs/render.yaml
#
# DEPLOYMENT SETUP:
# 1. Connect your GitHub repo to Render
# 2. Create a new "Web Service"
# 3. Set Root Directory to: apps/api
# 4. Render will auto-detect this render.yaml from the root
# 5. Set environment variables in Render dashboard (see envVars below)

services:
  - type: web
    name: codigo-binario-api
    runtime: node
    plan: free
    buildCommand: cd ../.. && pnpm install --filter=@binary-code/api... && cd apps/api && pnpm build
    startCommand: pnpm start
    envVars:
      # ── Supabase (required) ──
      - key: SUPABASE_URL
        sync: false  # Set in Render dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false  # Set in Render dashboard

      # ── AI Providers (at least one required) ──
      # Order: Gemini → Groq → NVIDIA → Anthropic → OpenAI
      - key: ANTHROPIC_API_KEY
        sync: false  # Set in Render dashboard
      - key: OPENAI_API_KEY
        sync: false  # Set in Render dashboard
      - key: GEMINI_API_KEY
        sync: false  # Set in Render dashboard
      - key: GROQ_API_KEY
        sync: false  # Set in Render dashboard
      - key: NVIDIA_API_KEY
        sync: false  # Set in Render dashboard

      # ── Config ──
      - key: PRIMARY_PROVIDER
        value: gemini
      - key: FALLBACK_PROVIDER
        value: groq
      # Optional model overrides
      # - key: NVIDIA_MODEL
      #   value: nvidia/llama-3.1-nemotron-70b-instruct
      - key: AI_TIMEOUT_MS
        value: "60000"
      - key: APP_TRUST_PROXY
        value: "true"

      # ── Rate limiting (public endpoints) ──
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "20"

      # ── Diagnostic notifications (email) ──
      # Default transport is a console logger (no-op). To enable email:
      #   NOTIFICATION_PROVIDER=resend
      #   RESEND_API_KEY=            # sync: false (set in Render dashboard)
      #   NOTIFICATION_EMAIL_FROM=   # e.g. "Código Binário <diagnostics@yourdomain>"
      - key: NOTIFICATION_PROVIDER
        value: console
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL_FROM
        sync: false
      # Recipient defaults to fabiobessadeoliveira2@gmail.com when unset.
      - key: NOTIFICATION_EMAIL_TO
        value: fabiobessadeoliveira2@gmail.com

      # Admin routes (GET/PATCH /api/leads, GET /api/discovery/session/:id and
      # ALL /api/projects/*) require this. If unset, those routes are disabled
      # (fail closed) rather than left open.
      - key: ADMIN_API_KEY
        sync: false  # Set in Render dashboard
      - key: CORS_ORIGINS
        sync: false  # Set to your Vercel URL, e.g. https://your-app.vercel.app
      - key: NODE_ENV
        value: production