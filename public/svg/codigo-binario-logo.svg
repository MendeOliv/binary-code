<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 720" width="700" height="720" role="img" aria-label="Código Binário - Tecnologia e Inovação">
  <title>Código Binário</title>
  <desc>Logo Código Binário - Tecnologia e Inovação</desc>
  
  <defs>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="40%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00C853"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .main-text {
        font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        font-weight: 700;
        font-size: 48px;
        fill: #00E676;
        letter-spacing: 4px;
      }
      .sub-text {
        font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        font-weight: 500;
        font-size: 22px;
        fill: #00C853;
        letter-spacing: 3px;
      }
    </style>
  </defs>

  <!-- Background is transparent -->

  <!-- Symbol group -->
  <g transform="translate(350, 280)" filter="url(#glow)">
    <!-- Outer geometric structure -->
    <path d="M 0 -160 L 130 -60 L 130 60 L 0 160 L -130 60 L -130 -60 Z" 
          fill="none" stroke="url(#greenGlow)" stroke-width="8" stroke-linejoin="round" opacity="0.9"/>
    
    <!-- Middle frame -->
    <path d="M 0 -115 L 90 -42 L 90 42 L 0 115 L -90 42 L -90 -42 Z" 
          fill="none" stroke="url(#greenGlow)" stroke-width="6" opacity="0.75"/>
    
    <!-- Side circuit-like extensions -->
    <path d="M -130 -25 L -175 0 L -130 25" fill="none" stroke="url(#greenGlow)" stroke-width="7" opacity="0.85"/>
    <path d="M 130 -25 L 175 0 L 130 25" fill="none" stroke="url(#greenGlow)" stroke-width="7" opacity="0.85"/>
    
    <!-- Lower wings -->
    <path d="M -90 50 L -140 90 L -70 90" fill="none" stroke="url(#greenGlow)" stroke-width="6" opacity="0.7"/>
    <path d="M 90 50 L 140 90 L 70 90" fill="none" stroke="url(#greenGlow)" stroke-width="6" opacity="0.7"/>
    
    <!-- Central glowing diamond -->
    <path d="M 0 -70 L 70 0 L 0 70 L -70 0 Z" fill="#00FF9C" opacity="0.95"/>
    <path d="M 0 -38 L 38 0 L 0 38 L -38 0 Z" fill="#001A0F"/>
    
    <!-- Bottom arrow / base -->
    <path d="M -40 90 L 0 160 L 40 90 L 18 90 L 18 125 L -18 125 L -18 90 Z" fill="url(#greenGlow)" opacity="0.9"/>
  </g>

  <!-- Text -->
  <text class="main-text" x="350" y="580" text-anchor="middle">CÓDIGO BINÁRIO</text>
  <text class="sub-text" x="350" y="620" text-anchor="middle">TECNOLOGIA E INOVAÇÃO</text>
</svg>
