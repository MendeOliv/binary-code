<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Código Binário Icon">
  <title>Código Binário</title>
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9C"/>
      <stop offset="50%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00C853"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer geometric frame (stylized diamond / circuit) -->
  <g transform="translate(100, 95)" fill="none" stroke="url(#glow)" stroke-width="4" stroke-linejoin="round" filter="url(#softGlow)">
    <!-- Main outer diamond-like structure -->
    <path d="M 0 -70 L 55 -25 L 55 25 L 0 70 L -55 25 L -55 -25 Z" opacity="0.9"/>
    
    <!-- Inner structure -->
    <path d="M 0 -50 L 38 -18 L 38 18 L 0 50 L -38 18 L -38 -18 Z" opacity="0.7"/>
    
    <!-- Side elements -->
    <path d="M -55 -10 L -75 0 L -55 10" opacity="0.8"/>
    <path d="M 55 -10 L 75 0 L 55 10" opacity="0.8"/>
  </g>

  <!-- Central glowing diamond -->
  <g transform="translate(100, 95)" filter="url(#softGlow)">
    <path d="M 0 -32 L 32 0 L 0 32 L -32 0 Z" fill="#00FF9C" opacity="0.95"/>
    <path d="M 0 -18 L 18 0 L 0 18 L -18 0 Z" fill="#001A0F"/>
  </g>

  <!-- Arrow / base element pointing down -->
  <g transform="translate(100, 95)" fill="url(#glow)" opacity="0.85">
    <path d="M -18 40 L 0 70 L 18 40 L 8 40 L 8 55 L -8 55 L -8 40 Z"/>
  </g>
</svg>
